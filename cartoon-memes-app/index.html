<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Funny Cartoon Memes App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    body {
      font-family: 'Comic Neue', cursive, sans-serif;
      background: #f9fafb;
    }
    /* Custom scrollbar for feed */
    .feed::-webkit-scrollbar {
      width: 8px;
    }
    .feed::-webkit-scrollbar-thumb {
      background-color: #a0aec0;
      border-radius: 4px;
    }
    .feed::-webkit-scrollbar-track {
      background: transparent;
    }
    /* Animation for meme cards */
    .meme-card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .meme-card:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 15px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">
  <header class="mb-6">
    <h1 class="text-4xl font-bold text-gray-800 flex items-center gap-3">
      <i class="fas fa-laugh fa-spin text-yellow-400"></i> Funny Cartoon Memes
    </h1>
  </header>

  <main class="w-full max-w-md h-[80vh] overflow-y-scroll feed snap-y snap-mandatory border border-gray-200 rounded-lg bg-white shadow-lg">
    <!-- Meme cards -->
    <section class="meme-card snap-start p-4 border-b border-gray-100">
      <img src="https://i.imgur.com/1J9Z1ZQ.gif" alt="Funny cartoon animation 1" class="w-full rounded-lg" />
      <p class="mt-2 text-gray-700 font-semibold text-center">When your coffee kicks in ☕😂</p>
    </section>
    <section class="meme-card snap-start p-4 border-b border-gray-100">
      <img src="https://i.imgur.com/3ZQ3ZQ3.png" alt="Funny cartoon meme 2" class="w-full rounded-lg" />
      <p class="mt-2 text-gray-700 font-semibold text-center">Monday mood be like...</p>
    </section>
    <section class="meme-card snap-start p-4 border-b border-gray-100">
      <img src="https://i.imgur.com/4ZQ4ZQ4.gif" alt="Funny cartoon animation 3" class="w-full rounded-lg" />
      <p class="mt-2 text-gray-700 font-semibold text-center">When the WiFi drops 😱</p>
    </section>
    <section class="meme-card snap-start p-4 border-b border-gray-100">
      <img src="https://i.imgur.com/5ZQ5ZQ5.png" alt="Funny cartoon meme 4" class="w-full rounded-lg" />
      <p class="mt-2 text-gray-700 font-semibold text-center">Trying to adult like...</p>
    </section>
    <section class="meme-card snap-start p-4 border-b border-gray-100">
      <video class="w-full rounded-lg" autoplay muted loop playsinline>
        <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm" type="video/webm" />
        Your browser does not support the video tag.
      </video>
      <p class="mt-2 text-gray-700 font-semibold text-center">Funny cartoon video 1</p>
    </section>
    <section class="meme-card snap-start p-4 border-b border-gray-100">
      <video class="w-full rounded-lg" autoplay muted loop playsinline>
        <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/bee.webm" type="video/webm" />
        Your browser does not support the video tag.
      </video>
      <p class="mt-2 text-gray-700 font-semibold text-center">Funny cartoon video 2</p>
    </section>
    <section class="meme-card snap-start p-4">
      <img src="https://i.imgur.com/6ZQ6ZQ6.gif" alt="Funny cartoon animation 5" class="w-full rounded-lg" />
      <p class="mt-2 text-gray-700 font-semibold text-center">When the weekend finally arrives 🎉</p>
    </section>
  </main>

  <footer class="mt-6 text-gray-500 text-sm">
    &copy; 2024 Funny Cartoon Memes App
  </footer>
</body>
</html>
